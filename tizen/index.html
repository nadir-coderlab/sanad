<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مكتب الخدمات الصحية المساندة</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #050d1a; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
// غلاف التطبيق على شاشة سامسونج: يفتح الصفحة من الإنترنت (عشان التحديثات توصل عن بعد)،
// وإذا ما فيه نت يفتح النسخة اللي داخل التطبيق. ويوصّل أزرار الريموت للصفحة، ويمنع شاشة التوقف.
var REMOTE = 'https://nadir-coderlab.github.io/sanad/tv.html';
var LOCAL = 'web/tv.html';
var f = document.getElementById('f');
fetch('https://nadir-coderlab.github.io/sanad/manifest.json', { cache: 'no-store' })
  .then(function (r) { f.src = r.ok ? REMOTE : LOCAL; })
  .catch(function () { f.src = LOCAL; });
try { webapis.appcommon.setScreenSaver(webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF); } catch (e) {}
try { tizen.power.request('SCREEN', 'SCREEN_NORMAL'); } catch (e) {}
// أزرار الريموت الإضافية (التشغيل والقنوات والألوان) لازم نطلبها من النظام
['MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaRewind', 'MediaFastForward', 'ChannelUp', 'ChannelDown',
 'ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue'].forEach(function (k) {
  try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
});
// الغلاف ماسك التركيز، ويرسل كل زر للصفحة
document.addEventListener('keydown', function (e) {
  e.preventDefault();
  if (f.contentWindow) f.contentWindow.postMessage({ sanadKey: e.keyCode }, '*');
});
f.addEventListener('load', function () { window.focus(); });
window.addEventListener('message', function (e) {
  if (e.data && e.data.sanad === 'exit') { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} }
});
</script>
</body>
</html>
