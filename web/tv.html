<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>مكتب الخدمات الصحية المساندة — الشاشة</title>
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div id="root">
  <!-- شاشة البداية: الباركود والملفات -->
  <section id="home">
    <div id="brand">
      <div id="clock"></div>
      <h1>مكتب الخدمات الصحية المساندة</h1>
      <p class="sub">اعرض ملفاتك على الشاشة من هاتفك</p>
      <ol id="steps">
        <li><b>١</b><span>امسح الباركود بكاميرا هاتفك</span></li>
        <li><b>٢</b><span>أدخل الرقم السري</span></li>
        <li><b>٣</b><span>أرسل ملفك واختر من هاتفك ما يُعرض</span></li>
      </ol>
    </div>
    <div id="qrcard">
      <div id="qr"></div>
      <div id="url" hidden></div>
      <div id="status"><i></i><span>جارٍ الاتصال…</span></div>
    </div>
    <img id="logo" src="img/cluster-logo-white.png" alt="تجمع المدينة المنورة الصحي">
    <div id="shelf" hidden>
      <div class="shelf-h"><span>الملفات</span><em id="hint">اختر بالأسهم ثم اضغط موافق</em></div>
      <div id="files"></div>
    </div>
  </section>

  <!-- العرض -->
  <section id="view" hidden>
    <div id="stage"><div id="pages"></div></div>
    <canvas id="ink" width="1920" height="1080"></canvas>
    <div id="hud"><span id="hud-name"></span><span id="hud-page"></span><span id="hud-zoom"></span></div>
    <div id="dot"></div>
  </section>

  <div id="toast" hidden></div>
</div>

<script src="vendor/qrcode.js"></script>
<script>
// في تطبيق أندرويد: نعلن عنوان الشاشة الحقيقي بدل الاسم المموّه (xxx.local) في مرشّحات WebRTC.
// الآيفون يخفي عنوانه، وأندرويد ما يحل أسماء .local، فلازم طرف واحد على الأقل يعلن عنوانه.
(function () {
  var ip = '';
  try { ip = window.SanadAndroid && SanadAndroid.localIp ? SanadAndroid.localIp() : ''; } catch (e) {}
  if (!ip || !window.RTCPeerConnection) return;
  var Orig = window.RTCPeerConnection, MDNS = /[0-9a-f]{8}-[0-9a-f-]{27}\.local/gi;
  function fix(e) {
    if (!e.candidate || !MDNS.test(e.candidate.candidate)) return e;
    MDNS.lastIndex = 0;
    var c = new RTCIceCandidate({ candidate: e.candidate.candidate.replace(MDNS, ip), sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex });
    return { type: 'icecandidate', candidate: c, target: e.target };
  }
  function P(cfg, opt) {
    var pc = new Orig(cfg, opt), add = pc.addEventListener.bind(pc), handler = null;
    pc.addEventListener = function (t, f, o) { return add(t, t === 'icecandidate' ? function (e) { f(fix(e)); } : f, o); };
    Object.defineProperty(pc, 'onicecandidate', { get: function () { return handler; }, set: function (f) { handler = f; } });
    add('icecandidate', function (e) { if (handler) handler(fix(e)); });
    return pc;
  }
  P.prototype = Orig.prototype;
  window.RTCPeerConnection = P;
})();
</script>
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="tv.js"></script>
</body>
</html>
