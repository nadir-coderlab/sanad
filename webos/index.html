<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مكتب الخدمات الصحية المساندة</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #050d1a; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  video { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: .01; pointer-events: none; }
</style>
</head>
<body>
<iframe id="f"></iframe>
<!-- شاشة التوقف في إل جي ما تشتغل وفيه فيديو يلعب، فنشغّل فيديو أسود صغير على طول -->
<video id="awake" src="keepawake.mp4" muted loop autoplay playsinline></video>
<script>
// غلاف «الخدمات المساندة» على شاشة إل جي (webOS): يفتح الصفحة من الإنترنت (عشان التحديثات توصل عن بعد)،
// وإذا ما فيه نت يفتح النسخة اللي داخل التطبيق. ويوصّل أزرار الريموت للصفحة.
var REMOTE = 'https://nadir-coderlab.github.io/sanad/tv.html';
var LOCAL = 'web/tv.html';
var f = document.getElementById('f');
fetch('https://nadir-coderlab.github.io/sanad/manifest.json', { cache: 'no-store' })
  .then(function (r) { f.src = r.ok ? REMOTE : LOCAL; })
  .catch(function () { f.src = LOCAL; });
var v = document.getElementById('awake');
setInterval(function () { if (v.paused) { try { v.play(); } catch (e) {} } }, 30000);
// الغلاف ماسك التركيز ويرسل كل زر للصفحة. زر الرجوع في إل جي 461، والصفحة تعرف رجوع سامسونج 10009
document.addEventListener('keydown', function (e) {
  e.preventDefault();
  var code = e.keyCode === 461 ? 10009 : e.keyCode;
  if (f.contentWindow) f.contentWindow.postMessage({ sanadKey: code }, '*');
});
f.addEventListener('load', function () { window.focus(); });
window.addEventListener('message', function (e) {
  if (e.data && e.data.sanad === 'exit') window.close();
});
</script>
</body>
</html>
