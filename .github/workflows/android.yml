# يبني تطبيق «مكتب الخدمات الصحية المساندة» لأندرويد TV (APK) وينشره برابط ثابت:
#   https://github.com/nadir-coderlab/sanad/releases/download/android-app/Sanad.apk
# يشتغل يدويًا من Actions، ولما يتغيّر android/ أو صفحة الشاشة (النسخة الاحتياطية داخل التطبيق).
name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/tv.*"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: مفتاح التوقيع من أسرار المستودع
        env:
          KS: ${{ secrets.SANAD_KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "::error::السر SANAD_KEYSTORE_B64 ناقص"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/sanad.keystore"
          echo "SANAD_KEYSTORE=$RUNNER_TEMP/sanad.keystore" >> "$GITHUB_ENV"

      - name: بناء APK موقَّع
        env:
          SANAD_KEYSTORE_PASSWORD: ${{ secrets.SANAD_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android :app:assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Sanad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sanad-apk
          path: Sanad.apk
          if-no-files-found: error

      - name: تحديث الإصدار بالرابط الثابت
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-app >/dev/null 2>&1 || \
            gh release create android-app --title "مكتب الخدمات الصحية المساندة — أندرويد TV" \
              --notes "آخر نسخة من تطبيق أندرويد TV، وتتحدّث مع كل بناء. التثبيت: adb install -r Sanad.apk"
          gh release upload android-app Sanad.apk --clobber
